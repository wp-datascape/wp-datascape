name: Generate Metrics

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics SVG
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta
          filename: metrics.svg
          output_action: none
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_indepth: no

      - name: Collect output
        run: |
          mkdir -p dist
          cp /metrics_renders/metrics.svg dist/metrics.svg

      - name: Push to metrics-output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: metrics-output
          build_dir: dist
          author: T Y O <work.wahyuprasetyo@gmail.com>
          committer: T Y O <work.wahyuprasetyo@gmail.com>
          commit_message: "chore: perbarui metrics"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
